<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - CloudShare</title>
  <meta name="description" content="Sign in to your CloudShare account to access and share your files.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 CSS via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <!-- Minimal Nav Header -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom py-3">
    <div class="container justify-content-between">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-dark fs-5" href="index.html">
        <div class="bg-primary text-white rounded-3 p-1 d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
          <i class="bi bi-cloud-arrow-up-fill fs-6"></i>
        </div>
        <span>Cloud<span class="text-primary">Share</span></span>
      </a>
      <span class="text-muted small">
        Don't have an account? <a href="register.html" class="text-primary text-decoration-none fw-semibold">Sign Up</a>
      </span>
    </div>
  </nav>

  <!-- Login Area -->
  <main class="auth-wrapper py-5">
    <div class="container d-flex justify-content-center">
      <div class="auth-card p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="auth-header-icon mb-3 mx-auto">
            <i class="bi bi-lock-fill"></i>
          </div>
          <h3 class="fw-bold font-display">Welcome Back</h3>
          <p class="text-muted small">Access your stored files and sharing dashboard</p>
        </div>

        <form id="loginForm" novalidate>
          <!-- Email Input -->
          <div class="mb-3">
            <label for="loginEmail" class="form-label fw-semibold small text-muted">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="loginEmail" placeholder="name@company.com" required value="alex.morgan@cloudshare.io">
            </div>
          </div>

          <!-- Password Input -->
          <div class="mb-3">
            <div class="d-flex justify-content-between">
              <label for="loginPassword" class="form-label fw-semibold small text-muted">Password</label>
              <a href="javascript:void(0)" onclick="showToast('Password reset link sent to demo email!', 'info')" class="small text-primary text-decoration-none">Forgot password?</a>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted"><i class="bi bi-shield-lock"></i></span>
              <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required value="SecretPass123!">
              <button class="btn btn-outline-secondary password-toggle-btn" type="button">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <!-- Remember Me Checkbox -->
          <div class="d-flex align-items-center justify-content-between mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe" checked>
              <label class="form-check-label small text-muted" for="rememberMe">
                Remember this device
              </label>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary w-100 py-2 mb-3 fw-semibold">
            Sign In to Dashboard
          </button>

          <!-- Quick Demo Button -->
          <button type="button" id="btnDemoLogin" class="btn btn-light border w-100 py-2 mb-4 text-muted small">
            <i class="bi bi-magic me-1 text-primary"></i> Fill Demo Credentials
          </button>

          <!-- Divider -->
          <div class="position-relative text-center my-3">
            <hr class="border-secondary-subtle">
            <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted small">or continue with</span>
          </div>

          <!-- Social Buttons -->
          <div class="row g-2">
            <div class="col-6">
              <button type="button" class="btn btn-light border w-100 py-2 d-flex align-items-center justify-content-center gap-2 small" onclick="showToast('Google OAuth simulated successfully', 'info')">
                <i class="bi bi-google text-danger"></i> Google
              </button>
            </div>
            <div class="col-6">
              <button type="button" class="btn btn-light border w-100 py-2 d-flex align-items-center justify-content-center gap-2 small" onclick="showToast('GitHub OAuth simulated successfully', 'info')">
                <i class="bi bi-github text-dark"></i> GitHub
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Bootstrap 5.3 JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <!-- Custom App JS -->
  <script src="app.js"></script>
</body>
</html>
